// ---------- Save / load ----------
const SAVE_KEY="3k_moh_save";
function serialize(){const g={...G};delete g.cityById;delete g.obyId;return JSON.stringify(g);}
function saveGame(silent){ if(!G||G.mode==="battle")return false;
  const data=serialize();
  try{ localStorage.setItem(SAVE_KEY,data); }catch(e){ window.__memSave=data; }
  if(!silent)toast("Campaign saved.");
  return true;
}
function savedData(){ try{const d=localStorage.getItem(SAVE_KEY);if(d)return d;}catch(e){} return window.__memSave||null; }
function hasSave(){ return !!savedData(); }
function loadGame(){
  const d=savedData(); if(!d){toast("No saved campaign found.");return;}
  try{
    const g=JSON.parse(d);
    g.cityById=Object.fromEntries(g.cities.map(c=>[c.id,c]));
    g.obyId=Object.fromEntries(g.officers.map(o=>[o.id,o]));
    g.mode="map"; g.marchFrom=null; g.over=false;
    G=g; closeModal(); renderLegend(); resize(); renderAll();
    log(`Campaign resumed — ${G.scen.name}, ${SEASONS[G.season]} ${G.scen.year+Math.floor((G.turn-1)/4)} AD.`,"gold");
  }catch(e){ toast("Saved campaign could not be read."); }
}
function autosave(){ saveGame(true); }
function showDigest(entries){
  if(!entries.length)return;
  const icon={triumph:"⚑",battle:"⚔",death:"✝",event:"◦"};
  const rows=entries.map(a=>{const col=a.cat==="triumph"?"#2f6b54":a.cat==="battle"?"#9c2b25":a.cat==="death"?"#7a4a44":"#5b4a36";
    return `<div class="battle-line"><div style="font-size:12px;color:#7a6a50;min-width:96px">${a.year} AD · ${a.season}</div><div class="battle-side" style="flex:1;color:${col}">${icon[a.cat]||"◦"} ${a.text}</div></div>`;}).join("");
  modal(`The Realm Stirs — ${SEASONS[G.season]}, ${G.scen.year+Math.floor((G.turn-1)/4)} AD`,
    `<div class="hint">While you deliberated, the other powers moved.</div><div style="max-height:44vh;overflow:auto;margin-top:8px">${rows}</div>`,
    [{t:"Stop showing digests",fn:()=>{G.showDigest=false;closeModal();}},{t:"Continue",cls:"primary",fn:closeModal}]);
}

// ---------- Custom officer creator ----------
function openCreator(){
  const labels={cmd:"Command",mgt:"Might",int:"Intellect",pol:"Politics",cha:"Charisma"};
  modal("Recruit a Custom Hero",
   `<div class="hint">Forge a new officer to enter your service (costs 800 gold). Distribute up to <b>360</b> stat points across the five attributes.</div>
    <div class="card"><div class="row"><span>Name</span><input id="co-name" value="New Officer" maxlength="24" style="font-family:inherit;padding:4px 8px;border:1px solid #cdbf9f;border-radius:4px;width:58%"></div>
    ${Object.keys(labels).map(s=>`<div class="row"><span>${labels[s]}</span><input id="co-${s}" type="number" min="20" max="100" value="60" oninput="creatorPoints()" style="width:74px;font-family:inherit;padding:3px 6px;border:1px solid #cdbf9f;border-radius:4px;text-align:right"></div>`).join("")}
    <div class="row"><span>Trait</span><select id="co-trait" style="font-family:inherit;padding:4px;border:1px solid #cdbf9f;border-radius:4px">${["None","Duelist","Cavalry","Archer","Fire Stratagem","Ambush","Navy","Healer"].map(t=>`<option>${t}</option>`).join("")}</select></div>
    <div class="row"><span>Points used</span><b id="co-pts">300 / 360</b></div></div>`,
   [{t:"Recruit (800g)",cls:"primary",fn:createOfficer},{t:"Cancel",fn:closeModal}]);
  creatorPoints();
}
function creatorPoints(){const sum=["cmd","mgt","int","pol","cha"].reduce((s,k)=>{const el=document.getElementById("co-"+k);return s+(el?+el.value||0:0);},0);
  const el=document.getElementById("co-pts");if(el){el.textContent=sum+" / 360";el.style.color=sum>360?"#9c2b25":"#2f6b54";}}
function createOfficer(){
  const get=k=>Math.max(20,Math.min(100,Math.round(+document.getElementById("co-"+k).value||60)));
  const st={cmd:get("cmd"),mgt:get("mgt"),int:get("int"),pol:get("pol"),cha:get("cha")};
  const sum=st.cmd+st.mgt+st.int+st.pol+st.cha;
  if(sum>360){toast(`Too many points (${sum}/360).`);return;}
  if((G.treasury[ME()]||0)<800){toast("Not enough gold (need 800).");return;}
  const cap=citiesOf(ME()).find(c=>c.base)||citiesOf(ME())[0]; if(!cap){toast("You hold no cities.");return;}
  const name=(document.getElementById("co-name").value||"New Officer").slice(0,24);
  let trait=document.getElementById("co-trait").value; if(trait==="None")trait=undefined;
  G.treasury[ME()]-=800;
  const id="custom_"+(G._custN=(G._custN||0)+1);
  const o={id,name,...st,trait,fac:ME(),loyalty:85,where:cap.id,age:26,ambition:40,exp:0,level:1,gain:0,born:G.scen.year-26};
  G.officers.push(o);G.obyId[id]=o;cap.officers.push(id);
  chronicle(`${name} enters your service — a hero of your own making.`,"triumph");
  closeModal();renderAll();
}

// ---------- Annals (auto-written, shareable chronicle) ----------
function annalsText(){
  const ruler=rulerOf(ME());
  let out=`ANNALS OF ${FACTIONS[ME()].name.toUpperCase()} — ${G.scen.name} (from ${G.scen.year} AD)\n`;
  out+=`Ruler: ${ruler?ruler.name:"—"}    Cities: ${citiesOf(ME()).length}/${G.cities.length}    Honor: ${Math.round(G.reputation)}    Legitimacy: ${Math.round(G.legitimacy[ME()]||0)}\n`;
  out+="".padEnd(64,"—")+"\n";
  if(!G.annals.length) out+="(No great deeds recorded yet.)\n";
  G.annals.forEach(a=>{ out+=`${a.year} AD, ${a.season}  —  ${a.text}\n`; });
  return out;
}
function openAnnals(){
  const icon={triumph:"⚑",battle:"⚔",death:"✝",event:"◦"};
  const rows = G.annals.length? G.annals.map(a=>{
    const col=a.cat==="triumph"?"#2f6b54":a.cat==="battle"?"#9c2b25":a.cat==="death"?"#7a4a44":"#5b4a36";
    return `<div class="battle-line"><div style="font-size:12px;color:#7a6a50;min-width:96px">${a.year} AD · ${a.season}</div>
      <div class="battle-side" style="flex:1;color:${col}">${icon[a.cat]||"◦"} ${a.text}</div></div>`;}).join("")
    : '<div class="hint">Your reign has yet to make history. Fight battles, win over heroes, and shape the realm — your deeds will be recorded here.</div>';
  const ruler=rulerOf(ME());
  modal(`Annals of ${FACTIONS[ME()].short} — ${G.scen.name}`,
    `<div class="hint">${ruler?ruler.name:"You"} · ${citiesOf(ME()).length}/${G.cities.length} cities · Honor ${Math.round(G.reputation)} · Legitimacy ${Math.round(G.legitimacy[ME()]||0)}</div>
     <div style="max-height:48vh;overflow:auto;margin-top:8px">${rows}</div>`,
    [{t:"⧉ Copy to share",fn:()=>{const t=annalsText();
        if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>toast("Annals copied to clipboard."),()=>toast("Copy failed; select the log text manually."));}
        else toast("Clipboard unavailable in this view.");}},
     {t:"Close",cls:"primary",fn:()=>{ if(G.over){closeModal();showStart();} else closeModal(); }}]);
}

// ---------- Onboarding tutorial ----------
let seenTutorial=false;
const TIPS=[
  {t:"Welcome, warlord",b:"You lead one faction in the collapse of Han China. Your goal: unify the realm and claim the <b>Mandate of Heaven</b> — hold a commanding majority of all cities, or the imperial seat at high legitimacy."},
  {t:"The realm map",b:"Each disc is a city, colored by its faction (yours glows when selected). ★ marks a capital, ⚑ shows stationed officers, and the number is its garrison. Dashed blue links are <b>river crossings</b> — fought as naval battles."},
  {t:"Govern your cities",b:"Click one of <b>your</b> cities and spend <b>Actions</b> (top bar) to Develop the economy, Train troops, build Walls, Pacify unrest, or Recruit nearby unaligned heroes. Actions refresh each turn."},
  {t:"Wage war",b:"Select your city, choose <b>March Army</b>, then click an adjacent enemy city. Fight the battle yourself in real-time-with-pause (pause with Space, use officer <b>stratagems</b>), or Auto-resolve. Win, and you decide the fate of captured officers."},
  {t:"Rule the court",b:"Officers have <b>loyalty</b> that drifts with your fortunes and honor. Neglect them and they defect — or rebel. <b>Reward</b> them, name an <b>heir</b> so your cause survives your ruler's death, and use <b>Diplomacy</b> (⚑) for tribute, marriage, and alliances."},
  {t:"Your legend awaits",b:"Every great deed is written to your <b>Annals</b> (📜) — a chronicle of your reign you can copy and share. Now: End Turn to let the realm move, and begin your ascent. Fortune favors the bold."},
];
function showTutorial(i){
  i=i||0; const tip=TIPS[i];
  const last=i>=TIPS.length-1;
  modal(`${tip.t}  ·  ${i+1}/${TIPS.length}`,`<div class="evt">${tip.b}</div>`,
    [ ...(i>0?[{t:"◂ Back",fn:()=>showTutorial(i-1)}]:[]),
      ...(!last?[{t:"Skip",fn:()=>{seenTutorial=true;closeModal();}}]:[]),
      {t:last?"Begin ▸":"Next ▸",cls:"primary",fn:()=>{ if(last){seenTutorial=true;closeModal();} else showTutorial(i+1); }} ]);
}

// ---------- Start screen ----------
function showStart(){
  const list=SCENARIOS.map((s,i)=>`<button onclick="pickScenario(${i})"><b>${s.name}</b> · ${s.year} AD<small>${s.blurb}</small></button>`).join("");
  const cont=hasSave()?`<button onclick="loadGame()" style="border-color:var(--gold);background:rgba(216,169,77,.12)"><b>▸ Continue Campaign</b><small>Resume your last saved game</small></button>`:"";
  modal("Choose Your Campaign",`<div class="hint">A modern reimagining of Romance of the Three Kingdoms. Pick a historical scenario, then the faction you will lead.</div><div class="pick">${cont}${list}</div>`,[]);
  document.getElementById("m-foot").style.display="none";
}
function pickScenario(i){
  const s=SCENARIOS[i];
  const facs=s.players.map((f,idx)=>`<button onclick="beginGame('${s.id}','${f}')"><b>${FACTIONS[f].short}</b><br><small>${FACTIONS[f].name}${idx===0?" · recommended":""}</small></button>`).join("");
  modal(s.name+" — Choose a Faction",`<div class="evt">${s.blurb}</div><div class="facpick" style="margin-top:12px">${facs}</div>`,
    [{t:"◂ Back",fn:showStart}]);
  document.getElementById("m-foot").style.display="";
}
function beginGame(scenId,fac){
  closeModal();
  initGame(scenId,fac);
  renderLegend();resize();renderAll();
  // auto-focus the player's capital
  const cap=citiesOf(ME()).find(c=>c.base)||citiesOf(ME())[0];
  if(cap){G.sel=cap.id;renderAll();}
  if(!seenTutorial)showTutorial(0);
}

// ---------- Boot ----------
(function(){let t="light";try{t=localStorage.getItem("3k_theme")||"light";}catch(e){}applyTheme(t);})();
showStart();
</script>
