<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three Kingdoms: Mandate of Heaven — Prototype</title>
<style>
:root{
  --bg:#e7ebf2; --bg2:#f3f6fa; --panel:#ffffff; --panel2:#f3f6fb; --elev:#e9eff7;
  --line:#dde3ec; --line2:#c9d3df;
  --text:#18202c; --muted:#5a6675;
  --dim:#8996a6;
  --accent:#d8452f; --accent-ink:#fff; --accent2:#c0871c;
  --jade:#1f9e6f; --danger:#d8452f; --warn:#c0871c;
  --sh:0 1px 2px rgba(24,32,44,.06),0 6px 20px rgba(24,32,44,.09);
  --topgrad:linear-gradient(180deg,#ffffff,#eef2f7);
  --overlay:rgba(255,255,255,.92);--overlay-line:rgba(24,32,44,.10);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
}
:root[data-theme="dark"]{
  --bg:#0c0f14; --bg2:#11151c; --panel:#161c25; --panel2:#1c232e; --elev:#232c39;
  --line:#28313f; --line2:#33404f;
  --text:#e8edf4; --muted:#98a4b5; --dim:#6c7789;
  --accent:#e5533d; --accent2:#e0a63f; --jade:#33c08b; --danger:#ef5350; --warn:#e0a63f;
  --sh:0 1px 2px rgba(0,0,0,.4),0 8px 26px rgba(0,0,0,.4);
  --topgrad:linear-gradient(180deg,#151b24,#0f141b);
  --overlay:rgba(17,21,28,.86);--overlay-line:rgba(255,255,255,.08);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:var(--sans);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* Top bar */
#topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;
  background:var(--topgrad);border-bottom:1px solid var(--line);box-shadow:0 2px 14px rgba(24,32,44,.10);z-index:5;flex-wrap:wrap}
#topbar .brand{font-size:15px;font-weight:700;letter-spacing:.14em;color:var(--text);white-space:nowrap;text-transform:uppercase;padding-right:6px}
#topbar .brand small{display:block;font-size:9px;letter-spacing:.22em;color:var(--accent2);font-weight:600;margin-top:1px}
.stat{display:flex;flex-direction:column;line-height:1.15;padding:4px 12px;min-width:56px;background:var(--panel);border:1px solid var(--line);border-radius:9px}
.stat b{font-size:15px;color:var(--text);font-variant-numeric:tabular-nums;font-weight:700}
.stat span{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.12em;margin-top:1px}
#turnbox{margin-left:auto;display:flex;align-items:center;gap:8px}

/* Buttons */
button{font-family:inherit;cursor:pointer;border:1px solid var(--line2);background:var(--panel2);
  color:var(--text);padding:8px 13px;border-radius:9px;font-size:13px;font-weight:600;transition:.14s ease;letter-spacing:.01em}
button:hover{background:var(--elev);border-color:#42505f}
button:active{transform:translateY(1px)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:linear-gradient(180deg,#e9604b,var(--accent));color:var(--accent-ink);border-color:transparent;box-shadow:0 3px 12px rgba(216,69,47,.35),inset 0 1px 0 rgba(255,255,255,.18)}
button.primary:hover{filter:brightness(1.06)}
button.ghost{background:transparent;color:var(--muted);border-color:var(--line)}
button.ghost:hover{background:var(--panel2);color:var(--text)}

/* Layout */
#main{flex:1;display:flex;min-height:0}
#mapwrap{flex:1;position:relative;background:var(--bg)}
canvas{display:block;width:100%;height:100%}
#side{width:352px;background:var(--bg2);border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
#sidehead{padding:13px 16px;background:var(--panel);border-bottom:1px solid var(--line);font-size:13px;font-weight:700;letter-spacing:.03em;color:var(--text)}
#sidebody{flex:1;overflow-y:auto;padding:14px}
.hint{color:var(--muted);font-size:12.5px;line-height:1.55}

/* Cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:12px;box-shadow:var(--sh);position:relative}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:1px;border-radius:12px 12px 0 0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);opacity:.6;pointer-events:none}
:root[data-theme="dark"] .card::before{background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent)}
.card h3{margin:0 0 10px;font-size:13px;font-weight:700;letter-spacing:.02em;display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--text)}
.tag{font-size:9.5px;font-weight:700;padding:2px 8px;border-radius:20px;color:#fff;letter-spacing:.08em;text-transform:uppercase}
.row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;color:var(--muted)}
.row b{font-variant-numeric:tabular-nums;color:var(--text);font-weight:600}
.bar{height:6px;background:#0c1016;border:1px solid var(--line);border-radius:20px;overflow:hidden;margin:5px 0 8px}
.bar>i{display:block;height:100%;border-radius:20px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
.actions button{padding:9px 6px;font-size:12px;font-weight:600;text-align:center}
.actions button small,.pick button small,.cap-choices button small,.prisoner .pa button small{font-weight:500}

/* Officer / prisoner rows */
.officer,.prisoner{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:10px;margin:5px 0;background:var(--panel2);border:1px solid var(--line)}
.officer .av,.prisoner .av{width:38px;height:38px;border-radius:10px;overflow:hidden;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:13px}
.av svg{width:100%;height:100%;display:block}
.officer .nm,.prisoner .pn{flex:1;font-size:13px;font-weight:600;line-height:1.25;color:var(--text)}
.officer .nm small,.prisoner .pn small{color:var(--dim);font-size:10.5px;display:block;font-weight:500;margin-top:1px}
.officer .st{font-size:10px;color:var(--muted);text-align:right;line-height:1.35;font-variant-numeric:tabular-nums}
.prisoner .pa{display:flex;gap:5px}
.prisoner .pa button{padding:5px 9px;font-size:11px}
.divider{border:0;border-top:1px solid var(--line);margin:14px 0}

/* Log */
#log{height:118px;overflow-y:auto;background:var(--bg);color:var(--muted);font-size:12px;padding:9px 14px;line-height:1.55;border-top:1px solid var(--line)}
#log .l{margin:2px 0;border-left:2px solid var(--line2);padding-left:9px}
#log .l.war{border-color:var(--danger);color:#f0a8a4}
#log .l.good{border-color:var(--jade);color:#8fe0be}
#log .l.gold{border-color:var(--accent2);color:#eecb86}

/* Modal */
#modal{position:fixed;inset:0;background:rgba(6,8,12,.7);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:20}
#modal.show{display:flex}
.dialog{background:var(--panel);border:1px solid var(--line2);border-radius:16px;max-width:600px;width:92%;max-height:88vh;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.6);border-top:3px solid var(--accent)}
.dialog .dh{padding:16px 20px;font-size:17px;font-weight:700;letter-spacing:.02em;color:var(--text);border-bottom:1px solid var(--line)}
.dialog .db{padding:18px 20px;color:var(--text)}
.dialog .df{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.battle-line{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.battle-side{font-size:14px}
.vs{font-size:19px;color:var(--accent);font-weight:800;padding:0 10px}
.evt{font-size:14px;line-height:1.65;color:var(--text)}

/* Overlays */
.legend{position:absolute;bottom:14px;left:14px;background:var(--overlay);backdrop-filter:blur(10px);color:var(--muted);padding:10px 13px;border-radius:12px;font-size:12px;border:1px solid var(--overlay-line)}
.legend .li{display:flex;align-items:center;gap:7px;margin:3px 0}
.legend .dot{width:10px;height:10px;border-radius:50%}
#help{position:absolute;top:14px;left:14px;background:var(--overlay);backdrop-filter:blur(10px);color:var(--muted);padding:9px 13px;border-radius:12px;font-size:12px;border:1px solid var(--overlay-line);max-width:260px;line-height:1.5}
@media(max-width:760px){#side{width:290px}#help{display:none}}

/* Battle HUD */
#bhud{position:absolute;top:0;left:0;right:0;display:none;align-items:center;gap:12px;padding:10px 16px;background:var(--overlay);backdrop-filter:blur(10px);color:var(--text);border-bottom:1px solid var(--overlay-line);z-index:6}
#bhud.show{display:flex}
#bhud .bstatus{font-size:13px;line-height:1.4;flex:1;color:var(--muted)}
#bhud .bstatus b{color:var(--text)}
#bhud .bbtns{display:flex;gap:7px}
#bhud button{padding:7px 12px;font-size:12px}
#bhud button.on{background:var(--accent);border-color:transparent;color:#fff}
.tgtcursor{cursor:crosshair}

/* Shake */
@keyframes shk{0%,100%{transform:translate(0,0)}20%{transform:translate(-5px,3px)}40%{transform:translate(4px,-4px)}60%{transform:translate(-3px,-3px)}80%{transform:translate(3px,3px)}}
#mapwrap.shaking{animation:shk .32s ease-in-out}

/* Order/creator/captured/pick */
.orderbtns{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
.captured-stat{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0;text-align:center}
.captured-stat .cs{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 2px;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.captured-stat .cs b{display:block;font-size:17px;color:var(--text);margin-bottom:1px}
.cap-choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.cap-choices button{padding:11px 10px;text-align:left;font-size:13px;line-height:1.35}
.cap-choices button small{display:block;color:var(--dim);font-size:11px;margin-top:3px}
.pick{display:grid;gap:9px;margin:8px 0}
.pick button{text-align:left;padding:14px 16px;border-radius:12px}
.pick button b{font-size:15px;color:var(--text)}
.pick button small{display:block;color:var(--muted);font-size:12px;margin-top:4px;line-height:1.5;font-weight:400}
.facpick{display:flex;gap:9px;flex-wrap:wrap}
.facpick button{flex:1;min-width:120px;text-align:center;padding:14px 8px;border-radius:12px}
input,select{background:var(--panel2);color:var(--text);border:1px solid var(--line2);border-radius:8px;font-family:inherit}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="brand" id="brand">三國 · MANDATE OF HEAVEN<small id="brandsub">PROTOTYPE</small></div>
    <div class="stat"><b id="s-gold">—</b><span>Gold</span></div>
    <div class="stat"><b id="s-food">—</b><span>Food</span></div>
    <div class="stat"><b id="s-cities">—</b><span>Cities</span></div>
    <div class="stat"><b id="s-officers">—</b><span>Officers</span></div>
    <div class="stat"><b id="s-honor">—</b><span>Honor</span></div>
    <div class="stat"><b id="s-ap">—</b><span>Actions</span></div>
    <div id="turnbox">
      <button id="b-help" class="ghost" title="How to play">?</button>
      <button id="b-theme" class="ghost" title="Light / dark theme">🌙</button>
      <button id="b-sound" class="ghost" title="Sound on/off">🔊</button>
      <button id="b-save" class="ghost" title="Save campaign">💾</button>
      <button id="b-annals" class="ghost">📜 Annals</button>
      <button id="b-diplomacy" class="ghost">⚑ Diplomacy</button>
      <button id="b-prisoners" class="ghost">⛓ 0</button>
      <div class="stat" style="text-align:right"><b id="s-turn">—</b><span id="s-season">—</span></div>
      <button id="endturn" class="primary">End Turn ▸</button>
    </div>
  </div>
  <div id="main">
    <div id="mapwrap">
      <canvas id="map"></canvas>
      <div id="help">Click a <b>city</b> to manage it. Select your city, then <b>March Army</b> onto an adjacent enemy/neutral city to attack. River crossings are fought as <b>naval battles</b>.</div>

      <div id="bhud"></div>
    </div>
    <div id="side">
      <div id="sidehead">Realm</div>
      <div id="sidebody"><div class="hint">Loading…</div></div>
    </div>
  </div>
  <div id="log"></div>
</div>

<div id="modal"><div class="dialog">
  <div class="dh" id="m-head">Event</div>
  <div class="db" id="m-body"></div>
  <div class="df" id="m-foot"></div>
</div></div>

<script>

const IMPERIAL_SEAT="luoyang"; // holding the old capital = "commanding the lords" (legitimacy)

// ---------- Full China map (geography only; scenarios set ownership) ----------
const CITY_DEFS = [
  {id:"beiping", name:"Beiping",  x:.74,y:.09, econ:4, def:5},

// ---------- Game state ----------
let G;
function initGame(scenId, playerFac){
  const scen=JSON.parse(JSON.stringify(SCENARIOS.find(s=>s.id===scenId)||SCENARIOS[0]));
  scen.own=scen.own||{}; scen.capitals=scen.capitals||{};
  // sandbox: scatter cities randomly among the factions each game
  let randomOwn=null;
  if(scen.random){
    randomOwn={}; const facs=scen.factions;
    const ids=CITY_DEFS.map(c=>c.id);
    for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]];}
    ids.forEach((id,i)=>{ randomOwn[id]= (i%6===5)?"neu":facs[i%facs.length]; });
    facs.forEach(f=>{ const first=ids.find(id=>randomOwn[id]===f)||ids[0]; randomOwn[first]=f; scen.capitals[f]=first; });
  }
  const cities=CITY_DEFS.map(c=>{
    let owner="neu";
    if(randomOwn){ owner=randomOwn[c.id]; }
    else for(const f in scen.own){ if(scen.own[f].includes(c.id)){owner=f;break;} }
    const base = scen.capitals[owner]===c.id;
    return {...c, owner, base,
      troops: base?13000:(owner==="neu"?4000+c.econ*400:6000+c.econ*500),
      pop:20000+c.econ*4000, order:78, wall:c.def*10, food:8000,
      devEcon:c.econ, devMil:c.def, officers:[], justTook:false};
  });
  const cityById=Object.fromEntries(cities.map(c=>[c.id,c]));
  // active factions in this scenario
  const active=new Set(["neu"]); Object.keys(scen.own).forEach(f=>active.add(f));
  (scen.factions||[]).forEach(f=>active.add(f));
  // build officers per scenario assignment
  const officers=[]; const facOf={};
  for(const f in scen.officers){ scen.officers[f].forEach(id=>{facOf[id]=f;}); }
  ROSTER.forEach(base=>{
    const f=facOf[base.id]; if(!f)return; // not present this scenario
    const age=Math.max(18, scen.year-(base.born||scen.year-35));
    officers.push({...base, fac:f, loyalty:88, where:null, age, ambition:base.amb??45, exp:0, level:1, gain:0});
  });
  const obyId=Object.fromEntries(officers.map(o=>[o.id,o]));
  // place officers in their faction's cities (capital first)
  for(const f of active){
    const os=officers.filter(o=>o.fac===f);
    if(!os.length)continue;
    let homes=cities.filter(c=>c.owner===f);
    if(f==="neu"||!homes.length) homes=cities.filter(c=>c.owner==="neu");
    if(!homes.length) homes=cities;
    const cap=cityById[scen.capitals[f]];
    if(cap&&cap.owner===f) homes=[cap,...homes.filter(c=>c!==cap)];
    os.forEach((o,i)=>{const c=homes[i%homes.length]; o.where=c.id; c.officers.push(o.id);});
  }
  const treasury={},foodStore={};
  active.forEach(f=>{treasury[f]=f===playerFac?3200:(f==="neu"?0:5500); foodStore[f]=f==="neu"?0:9000;});
  G={
    scen, player:playerFac, active:[...active],
    turn:1, season:0, cities, cityById, officers, obyId,
    treasury, foodStore, ap:4, maxAp:4, sel:null, marchFrom:null, over:false,
    mode:"map", reputation:55, prisoners:[], ally:null,
    momentum:{}, nextgen:NEXTGEN.map(g=>({...g})),
    rulers:{}, heirs:{}, legitimacy:{}, relations:{}, coalition:null,
    annals:[], showDigest:true,
  };
  // rulers, heirs, legitimacy, relations
  [...active].filter(f=>f!=="neu").forEach(f=>{
    const r=pickRuler(f); if(r){r.isRuler=true;G.rulers[f]=r.id;}
    G.heirs[f]=pickHeir(f);
    G.legitimacy[f]=40;
    if(f!==playerFac) G.relations[f]=50;
  });
  const facName=FACTIONS[playerFac].name;
  log(`${scen.name} (${scen.year} AD). You lead ${facName}. Recruit heroes, master the realm, and claim the Mandate of Heaven.`,"gold");
}

// ---------- Audio (procedural, no assets) ----------
let AC=null, soundOn=true, musicStarted=false, battleIntensity=false;
function audio(){ if(!soundOn)return null;
  if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;} }
  if(AC&&AC.state==="suspended")AC.resume();
  return AC; }
function tone(freq,dur,type,gain,delay){ const ac=audio(); if(!ac)return;
  const t=ac.currentTime+(delay||0), o=ac.createOscillator(), g=ac.createGain();
  o.type=type||"sine"; o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(gain||0.12,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur+0.03); }
function noise(dur,gain,hp){ const ac=audio(); if(!ac)return;
  const n=ac.createBufferSource(), buf=ac.createBuffer(1,Math.floor(ac.sampleRate*dur),ac.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1; n.buffer=buf;
  const g=ac.createGain(); g.gain.setValueAtTime(gain||0.2,ac.currentTime); g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+dur);
  const f=ac.createBiquadFilter(); f.type="highpass"; f.frequency.value=hp||900;
  n.connect(f).connect(g).connect(ac.destination); n.start(); n.stop(ac.currentTime+dur); }

function hashStr(s){let h=0;for(let i=0;i<(s||"").length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h);}
function portraitSVG(o){
  const h=hashStr(o.id||o.name), skins=["#e6c7a0","#dcae86","#c99a6e","#b3844f"];
  const skin=skins[h%skins.length];
  const warrior=(o.mgt||50)>=(o.int||50);
  const old=(o.age||30)>46;
  const beard=old||(warrior&&(h>>2)%2===0);
  const robe=facColor(o.fac||"neu");
  const hat= (o.isRuler)?"crown":(warrior?"helmet":"cap");
  const hatCol= hat==="helmet"?"#7a6136":hat==="crown"?"#d8a94d":"#2f3350";
  const fierce=(o.mgt||50)>85;
  let s=`<svg viewBox="0 0 40 44" xmlns="http://www.w3.org/2000/svg">`;
  s+=`<rect width="40" height="44" fill="#efe5d2"/>`;
  s+=`<path d="M4 44 Q20 28 36 44 Z" fill="${robe}"/>`;                 // robe/shoulders
  s+=`<rect x="17" y="24" width="6" height="6" fill="${skin}"/>`;        // neck
  s+=`<ellipse cx="20" cy="18" rx="8.5" ry="9.5" fill="${skin}"/>`;      // face
  if(beard) s+=`<path d="M12 19 Q20 34 28 19 Q20 26 12 19Z" fill="#2a231c" opacity="0.85"/>`;
  s+=`<path d="M15 16 q2 -1.4 4 0" stroke="#2a231c" stroke-width="1.1" fill="none"/>`; // brows
  s+=`<path d="M21 16 q2 -1.4 4 0" stroke="#2a231c" stroke-width="1.1" fill="none"/>`;
  s+=`<circle cx="17" cy="18" r="1.1" fill="#241a12"/><circle cx="23" cy="18" r="1.1" fill="#241a12"/>`; // eyes
  s+=`<path d="M16 22 q4 ${fierce?1.6:2.4} 8 0" stroke="#7a4a3a" stroke-width="1" fill="none"/>`; // mustache/mouth
  // headwear
  if(hat==="helmet"){ s+=`<path d="M10 12 Q20 -2 30 12 L30 14 Q20 8 10 14 Z" fill="${hatCol}"/><rect x="19" y="1" width="2" height="6" fill="#c0392b"/>`; }
  else if(hat==="crown"){ s+=`<path d="M11 11 L13 4 L17 9 L20 3 L23 9 L27 4 L29 11 Z" fill="${hatCol}" stroke="#8a6520" stroke-width="0.6"/>`; }
  else { s+=`<path d="M11 12 Q20 2 29 12 Q20 7 11 12 Z" fill="${hatCol}"/><rect x="18" y="3" width="4" height="4" fill="${hatCol}"/>`; }
  s+=`</svg>`;
  return s;
}

// ---------- Rendering (strategic map) ----------
const cv=document.getElementById("map"),ctx=cv.getContext("2d");
let DPR=window.devicePixelRatio||1;
function resize(){const w=cv.clientWidth,h=cv.clientHeight;cv.width=w*DPR;cv.height=h*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);draw();}
window.addEventListener("resize",resize);
function px(c){return {x:c.x*cv.clientWidth, y:c.y*cv.clientHeight};}

function draw(){
  if(!G)return;
  if(G.mode==="battle"){return drawBattle();}
  const w=cv.clientWidth,h=cv.clientHeight;
  ctx.clearRect(0,0,w,h);
  const T=TH();
  const g=ctx.createLinearGradient(0,0,w,h);
  g.addColorStop(0,T.mapA);g.addColorStop(1,T.mapB);
  ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  // subtle grid texture
  ctx.strokeStyle=T.grid;ctx.lineWidth=1;
  for(let gx=0;gx<w;gx+=46){ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,h);ctx.stroke();}
  for(let gy=0;gy<h;gy+=46){ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(w,gy);ctx.stroke();}
  // faction territory shading — soft influence blobs behind cities build up into regions
  G.cities.forEach(c=>{ if(c.owner==="neu")return; const p=px(c),col=facColor(c.owner),rad=80+c.devEcon*3;
    const gr=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,rad);
    gr.addColorStop(0,hexA(col,THEME_MODE==="light"?0.20:0.30));gr.addColorStop(1,hexA(col,0));
    ctx.fillStyle=gr;ctx.beginPath();ctx.arc(p.x,p.y,rad,0,7);ctx.fill(); });
  // Yangtze — layered for depth
  ctx.lineCap="round";
  ctx.strokeStyle=T.river;ctx.lineWidth=15;
  ctx.beginPath();ctx.moveTo(.14*w,.60*h);ctx.bezierCurveTo(.34*w,.72*h,.52*w,.60*h,.66*w,.68*h);
  ctx.bezierCurveTo(.78*w,.73*h,.86*w,.62*h,.95*w,.66*h);ctx.stroke();
  ctx.strokeStyle=T.riverCore;ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(.14*w,.60*h);ctx.bezierCurveTo(.34*w,.72*h,.52*w,.60*h,.66*w,.68*h);
  ctx.bezierCurveTo(.78*w,.73*h,.86*w,.62*h,.95*w,.66*h);ctx.stroke();ctx.lineWidth=1;
  // edges
  EDGES.forEach(e=>{const a=px(G.cityById[e[0]]),b=px(G.cityById[e[1]]);const nav=isNaval(e[0],e[1]);
    ctx.strokeStyle=nav?T.edgeNav:T.edge;ctx.setLineDash(nav?[3,4]:[6,5]);ctx.lineWidth=nav?2.5:1.5;
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.setLineDash([]);});
  // march targets
  if(G.marchFrom){
    neighborsOf(G.marchFrom).forEach(nid=>{const c=G.cityById[nid];
      if(c.owner===ME()||c.owner===G.ally)return;
      const p=px(c);ctx.strokeStyle=T.march?"#d8452f":"#e5533d";ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,24,0,7);ctx.stroke();});
    const fpt=px(G.cityById[G.marchFrom]);ctx.fillStyle="#d8452f";ctx.font="600 11px system-ui,sans-serif";ctx.textAlign="center";
    ctx.fillText("marching from here →",fpt.x,fpt.y-28);
  }
  // vignette (under cities so labels stay crisp)
  const vg=ctx.createRadialGradient(w/2,h*0.45,Math.min(w,h)*0.32,w/2,h*0.5,Math.max(w,h)*0.72);
  vg.addColorStop(0,"rgba(0,0,0,0)");vg.addColorStop(1,T.vignette);ctx.fillStyle=vg;ctx.fillRect(0,0,w,h);
  // cities — glossy tokens with shadow
  G.cities.forEach(c=>{
    const p=px(c),col=facColor(c.owner),r=10+c.devEcon*1.0;
    if(G.sel===c.id){ctx.save();ctx.shadowColor="rgba(216,69,47,.7)";ctx.shadowBlur=16;ctx.fillStyle="rgba(216,69,47,.28)";ctx.beginPath();ctx.arc(p.x,p.y,r+8,0,7);ctx.fill();ctx.restore();}
    ctx.save();ctx.shadowColor="rgba(0,0,0,"+(THEME_MODE==="light"?.28:.55)+")";ctx.shadowBlur=9;ctx.shadowOffsetY=2;
    const grd=ctx.createRadialGradient(p.x-r*0.4,p.y-r*0.5,r*0.15,p.x,p.y,r);
    grd.addColorStop(0,lighten(col,0.4));grd.addColorStop(1,col);
    ctx.fillStyle=grd;ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.fill();ctx.restore();
    ctx.strokeStyle=T.cityStroke;ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.stroke();
    ctx.strokeStyle=T.wallRing;ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,r-4,-1.57,-1.57+6.283*(c.wall/100));ctx.stroke();
    if(c.base){ctx.fillStyle=T.star;ctx.font="bold 12px system-ui,sans-serif";ctx.textAlign="center";ctx.fillText("★",p.x,p.y-r-3);}
    ctx.fillStyle="#fff";ctx.font="bold 10px system-ui,sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.save();ctx.shadowColor="rgba(0,0,0,.5)";ctx.shadowBlur=2;ctx.fillText(fmt(c.troops),p.x,p.y);ctx.restore();
    ctx.fillStyle=T.name;ctx.font="600 12px system-ui,sans-serif";ctx.textBaseline="top";ctx.fillText(c.name,p.x,p.y+r+3);
    const os=c.officers.length;if(os){ctx.fillStyle=T.flag;ctx.font="9px system-ui,sans-serif";ctx.fillText("⚑".repeat(Math.min(os,5)),p.x,p.y-r-(c.base?16:5));}
  });
  ctx.textBaseline="alphabetic";
}

// ---------- Side panel ----------
function pct(v,max,col){return `<div class="bar"><i style="width:${Math.max(0,Math.min(100,v/max*100))}%;background:${col}"></i></div>`;}
function officerRow(o,mine){
  const lc=o.loyalty<30?"#c0392b":o.loyalty<60?"#c9772f":"#2f6b54";
  return `<div class="officer">
  ${avatar(o)}
  <div class="nm">${o.name}${o.trait?` · ${o.trait}`:""}${o.level>1?` · Lv${o.level}`:""}<small>Loyalty <b style="color:${lc}">${Math.round(o.loyalty)}</b> · Age ${o.age||"?"}${o.ambition>=70?' · <span style="color:#c9772f">ambitious</span>':""}</small></div>
  <div class="st">CMD ${o.cmd} · MGT ${o.mgt}<br>${mine?`<button style="font-size:10px;padding:2px 7px;margin-top:2px" onclick="rewardOfficer('${o.id}')">Reward</button>`:`INT ${o.int} · CHA ${o.cha}`}</div></div>`;}
function renderSide(){
  if(G.mode==="battle"){return renderBattleSide();}
  const head=document.getElementById("sidehead"),body=document.getElementById("sidebody");
  if(!G.sel){head.textContent="Realm";
    const mine=citiesOf(ME());
    const ruler=rulerOf(ME()),heir=G.heirs[ME()]&&G.obyId[G.heirs[ME()]];
    body.innerHTML=`<div class="hint">Select a city on the map.</div><hr class="divider">
      <div class="card"><h3>${FACTIONS[ME()].name}</h3>
      <div class="row"><span>Ruler</span><b>${ruler?ruler.name+" (age "+ruler.age+")":"—"}</b></div>
      <div class="row"><span>Heir</span><b>${heir?heir.name:"none"}</b></div>
      <button style="width:100%;margin:6px 0 0" onclick="designateHeir()">Designate Heir</button>
      <button style="width:100%;margin:6px 0" onclick="openCreator()">＋ Create Officer</button>
      <div class="row"><span>Cities</span><b>${mine.length}/${G.cities.length}</b></div>
      <div class="row"><span>Total troops</span><b>${fmt(mine.reduce((s,c)=>s+c.troops,0))}</b></div>
      <div class="row"><span>Officers</span><b>${G.officers.filter(o=>o.fac===ME()&&!o._prisoner).length}</b></div>
      <div class="row"><span>Honor</span><b>${Math.round(G.reputation)}</b></div>
      <div class="row"><span>Legitimacy (Mandate)</span><b>${Math.round(G.legitimacy[ME()]||0)}</b></div>${pct(G.legitimacy[ME()]||0,100,"#b8893a")}
      ${(()=>{const r=G.officers.filter(o=>o.fac===ME()&&!o._prisoner&&o.loyalty<40).length;return r?`<div class="row"><span style="color:#9c2b25">Restless officers</span><b style="color:#9c2b25">${r}</b></div>`:"";})()}
      ${G.ally?`<div class="row"><span>Ally</span><b>${FACTIONS[G.ally].short}</b></div>`:""}
      </div>
      <div class="hint" style="margin-top:6px">Neglected officers lose loyalty and may defect or rebel. Select a city and <b>Reward</b> them to keep their allegiance.</div>`; return;}
  const c=G.cityById[G.sel],mine=c.owner===ME();
  head.textContent=c.name+" — "+FACTIONS[c.owner].short;
  const os=officersAt(c.id).filter(o=>!o._prisoner);
  let h=`<div class="card">
    <h3>${c.name} <span class="tag" style="background:${facColor(c.owner)}">${FACTIONS[c.owner].short}</span>${c.base?'<span class="tag" style="background:#b8893a">CAPITAL</span>':''}</h3>
    <div class="row"><span>Garrison</span><b>${fmt(c.troops)}</b></div>
    <div class="row"><span>Walls</span><b>${c.wall}</b></div>${pct(c.wall,100,"#8a7d63")}
    <div class="row"><span>Order</span><b>${Math.round(c.order)}%</b></div>${pct(c.order,100,c.order<50?"#9c2b25":"#2f6b54")}
    <div class="row"><span>Economy lv</span><b>${c.devEcon}</b></div>
    <div class="row"><span>Food</span><b>${fmt(c.food)}</b></div></div>`;
  if(mine){
    h+=`<div class="card"><h3>Govern</h3><div class="hint">Each action costs 1 AP (you have ${G.ap}).</div>
      <div class="actions">
        <button onclick="act('dev')">Develop<br><small>+gold/turn</small></button>
        <button onclick="act('train')">Train<br><small>+3,000 troops</small></button>
        <button onclick="act('wall')">Build Walls<br><small>+defense</small></button>
        <button onclick="act('order')">Pacify<br><small>+order</small></button>
        <button onclick="act('recruit')">Recruit<br><small>nearby heroes</small></button>
        <button onclick="act('march')">March Army ▸<br><small>then click target</small></button>
      </div></div>`;
  } else {
    const reach=citiesOf(ME()).some(mc=>adj(mc.id,c.id));
    const canAlly = c.owner!=="neu" && c.owner!==G.ally;
    h+=`<div class="card"><h3>Foreign City</h3>
      <div class="hint">${reach?"Adjacent to your territory. Select your bordering city and March to attack"+(neighborsOf(c.id).some(n=>G.cityById[n].owner===ME()&&isNaval(n,c.id))?" — this front is fought at sea.":"."):"Not adjacent to your lands."}</div>
      ${canAlly?`<button onclick="proposeAlly('${c.owner}')" style="margin-top:8px;width:100%">Propose Alliance with ${FACTIONS[c.owner].short}</button>`:""}
      ${c.owner===G.ally?`<button onclick="breakAlly()" style="margin-top:8px;width:100%">Break Alliance with ${FACTIONS[c.owner].short}</button>`:""}
      <button onclick="openIntrigue('${c.id}')" style="margin-top:8px;width:100%">🗡 Intrigue ▸</button>
      </div>`;
  }
  h+=`<div class="card"><h3>Officers <span class="tag" style="background:#5b4a36">${os.length}</span></h3>
      ${os.length?os.map(o=>officerRow(o,mine)).join(""):'<div class="hint">No officers stationed here.</div>'}</div>`;
  body.innerHTML=h;
}

// ---------- Top bar ----------
function renderTop(){
  document.getElementById("s-gold").textContent=fmt(G.treasury[ME()]||0);
  document.getElementById("s-food").textContent=fmt(G.foodStore[ME()]||0);
  document.getElementById("s-cities").textContent=citiesOf(ME()).length;
  document.getElementById("s-officers").textContent=G.officers.filter(o=>o.fac===ME()&&!o._prisoner).length;
  document.getElementById("s-honor").textContent=Math.round(G.reputation);
  document.getElementById("s-ap").textContent=G.ap+"/"+G.maxAp;
  document.getElementById("s-turn").textContent="Year "+(G.scen.year+Math.floor((G.turn-1)/4));
  document.getElementById("s-season").textContent=SEASONS[G.season]+" · Turn "+G.turn;
  document.getElementById("b-prisoners").textContent="⛓ "+G.prisoners.length;
  document.getElementById("brandsub").textContent=G.scen.name.toUpperCase()+" · "+FACTIONS[ME()].short.toUpperCase();
}
function renderAll(){renderTop();renderSide();draw();}
function renderLegend(){
  const el=document.getElementById("legend");
  el.innerHTML=G.active.map(f=>`<div class="li"><span class="dot" style="background:${facColor(f)}"></span>${FACTIONS[f].name}${f===ME()?" (you)":f===G.ally?" (ally)":""}</div>`).join("")
    +`<div class="li" style="margin-top:4px;color:#ffe9a8">★ capital&nbsp;&nbsp;⚑ officers&nbsp;&nbsp;~ river</div>`;
}

// ---------- Actions ----------
function need(g,fd){if(G.ap<=0){toast("No actions left this turn.");return false;}
  if(g&&(G.treasury[ME()]||0)<g){toast("Not enough gold.");return false;}
  if(fd&&(G.foodStore[ME()]||0)<fd){toast("Not enough food.");return false;}return true;}
function spend(g,fd){G.ap--;if(g)G.treasury[ME()]-=g;if(fd)G.foodStore[ME()]-=fd;}
function act(kind){
  const c=G.cityById[G.sel];if(!c||c.owner!==ME())return;
  if(kind==="dev"){if(!need(300))return;spend(300);c.devEcon++;c.pop+=2000;log(`${c.name} markets expand (Economy lv ${c.devEcon}).`,"gold");}
  else if(kind==="train"){if(!need(400,1500))return;spend(400,1500);c.troops+=3000;log(`${c.name} drills +3,000 troops.`);}
  else if(kind==="wall"){if(!need(350))return;spend(350);c.wall=Math.min(100,c.wall+15);log(`${c.name} reinforces its walls (Def ${c.wall}).`);}
  else if(kind==="order"){if(!need(150))return;spend(150);c.order=Math.min(100,c.order+20);log(`${c.name} order restored to ${Math.round(c.order)}%.`);}
  else if(kind==="recruit"){tryRecruit(c);}
  else if(kind==="march"){if(c.troops<2000){toast("Garrison too small to march (need 2,000+).");return;}
    G.marchFrom=c.id;toast("Select an adjacent enemy or neutral city to attack.");draw();return;}
  renderAll();checkVictory();
}
function tryRecruit(c){
  const pool=[];const ids=[c.id,...neighborsOf(c.id)];
  ids.forEach(id=>officersAt(id).forEach(o=>{if(o.fac==="neu"&&!o._prisoner)pool.push(o);}));
  if(!pool.length){toast("No unaligned heroes nearby to recruit.");return;}
  if(!need(250))return;
  const recruiter=Math.max(bestOfficerStat(c,"cha"),60);
  const o=pool[0];spend(250);
  if(Math.random()*100 < recruiter*0.85){
    const from=G.cityById[o.where];from.officers=from.officers.filter(x=>x!==o.id);
    o.fac=ME();o.where=c.id;o.loyalty=80;c.officers.push(o.id);
    log(`${o.name} pledges service to you at ${c.name}!`,"good");
  } else log(`${o.name} declines your overture for now.`);
}
function proposeAlly(fac){
  if(G.ally&&G.ally!==fac){toast("Break your current alliance first.");return;}
  const rel=G.relations[fac]??50;
  modal(`Alliance with ${FACTIONS[fac].name}`,
    `<div class="evt">Relations with ${FACTIONS[fac].short} are <b>${relLabel(rel)}</b> (${Math.round(rel)}). ${rel<25?"They are too cool to consider a pact — send tribute or arrange a marriage through the Diplomacy screen first.":"While allied, they will not attack you, your officers fight with steadier morale, and you may focus your armies elsewhere."}</div>`,
    rel<25?[{t:"Open Diplomacy",cls:"primary",fn:()=>{closeModal();openDiplomacy();}},{t:"Close",fn:closeModal}]
    :[{t:"Seal the alliance",cls:"primary",fn:()=>{G.ally=fac;G.relations[fac]=Math.min(100,rel+15);closeModal();log(`You are now allied with ${FACTIONS[fac].name}.`,"good");renderAll();}},
     {t:"Not yet",fn:closeModal}]);
}
function breakAlly(){const f=G.ally;G.ally=null;G.reputation=Math.max(0,G.reputation-6);
  if(f)G.relations[f]=Math.max(0,(G.relations[f]??50)-30);
  log(`You break your alliance with ${FACTIONS[f].short} (honor −6).`,"war");renderAll();}
// ---------- Diplomacy ----------
function relLabel(v){return v>=75?"Cordial":v>=55?"Warm":v>=40?"Neutral":v>=22?"Cool":"Hostile";}
function openDiplomacy(){
  const facs=G.active.filter(f=>f!=="neu"&&f!==ME());
  if(!facs.length){modal("Diplomacy","<div class='evt'>There are no rival powers to treat with.</div>",[{t:"Close",cls:"primary",fn:closeModal}]);return;}
  const rows=facs.map(f=>{
    const rel=G.relations[f]??50, allied=G.ally===f, ruler=rulerOf(f);
    const cities=citiesOf(f).length, married=G._marriages&&G._marriages[f];
    const col=rel>=55?"#2f6b54":rel>=40?"#8a7d63":"#9c2b25";
    return `<div class="card"><h3><span class="tag" style="background:${facColor(f)}">${FACTIONS[f].short}</span> ${FACTIONS[f].name}${allied?' <span class="tag" style="background:#2f6b54">ALLIED</span>':''}${G.coalition===f?' <span class="tag" style="background:#9c2b25">COALITION TARGET</span>':''}</h3>
      <div class="row"><span>Ruler</span><b>${ruler?ruler.name:"—"}</b></div>
      <div class="row"><span>Cities · Legitimacy</span><b>${cities} · ${Math.round(G.legitimacy[f]||0)}</b></div>
      <div class="row"><span>Relations</span><b style="color:${col}">${relLabel(rel)} (${Math.round(rel)})</b></div>${pct(rel,100,col)}
      <div class="orderbtns" style="grid-template-columns:1fr 1fr 1fr">
        ${allied?`<button onclick="breakAlly();openDiplomacy()">Break Alliance</button>`:`<button ${rel>=25?"":"disabled"} onclick="allyVia('${f}')">Alliance</button>`}
        <button onclick="sendTribute('${f}')">Tribute 400g</button>
        <button ${married?"disabled":""} onclick="arrangeMarriage('${f}')">Marriage</button>
      </div>
      ${rel<25&&!allied?'<div class="hint">Relations too cool for an alliance — send tribute or arrange a marriage first.</div>':""}
    </div>`;}).join("");
  modal("Diplomacy",`<div class="hint">Your honor stands at ${Math.round(G.reputation)}. Warm relations deter attacks; a coalition forms against any power that grows too dominant.</div>${rows}`,[{t:"Close",cls:"primary",fn:closeModal}]);
}
function allyVia(f){if((G.relations[f]??50)<25){toast("Relations too cool.");return;}
  if(G.ally&&G.ally!==f){toast("Break your current alliance first.");return;}
  G.ally=f;G.relations[f]=Math.min(100,(G.relations[f]??50)+15);chronicle(`You forged an alliance with ${FACTIONS[f].name}.`,"event");openDiplomacy();renderTop();}
function sendTribute(f){
  if((G.treasury[ME()]||0)<400){toast("Not enough gold for tribute (400).");return;}
  if(G._tributeTurn&&G._tributeTurn[f]===G.turn){toast("Already sent tribute this turn.");return;}
  G.treasury[ME()]-=400;G.relations[f]=Math.min(100,(G.relations[f]??50)+12);
  G._tributeTurn=G._tributeTurn||{};G._tributeTurn[f]=G.turn;
  log(`You send tribute to ${FACTIONS[f].short} (relations +12).`,"gold");openDiplomacy();renderTop();
}
function arrangeMarriage(f){
  G._marriages=G._marriages||{};
  if(G._marriages[f]){toast("A marriage already binds your houses.");return;}
  if((G.treasury[ME()]||0)<300){toast("A wedding befitting the houses costs 300 gold.");return;}
  const mine=G.officers.filter(o=>o.fac===ME()&&!o._prisoner&&!o.married);
  const theirs=G.officers.filter(o=>o.fac===f&&!o._prisoner&&!o.married);
  if(!mine.length||!theirs.length){toast("No unwed officers to join the houses.");return;}
  G.treasury[ME()]-=300;
  const a=mine.sort((x,y)=>y.cha-x.cha)[0], b=theirs.sort((x,y)=>y.cha-x.cha)[0];
  a.married=b.married=true; G._marriages[f]=true;
  G.relations[f]=Math.min(100,(G.relations[f]??50)+25); a.loyalty=Math.min(100,a.loyalty+8);
  chronicle(`A dynastic marriage joined ${a.name} of your house to ${b.name} of ${FACTIONS[f].short}.`,"event");
  openDiplomacy();renderTop();
}

// ---------- Abstract combat (auto-resolve & AI) ----------
function strength(city,attackingTroops,attackerSide){
  const os=attackerSide?attackerSide:officersAt(city.id);
  const cmd=os.length?Math.max(...os.map(o=>o.cmd)):40;
  const mgt=os.length?Math.max(...os.map(o=>o.mgt)):40;
  return {power:(attackingTroops||city.troops)*(0.7+cmd/140+mgt/300), cmd, mgt, os};
}
function battlePreview(army,atkOs,to){
  const A=strength(null,army,atkOs).power;
  const D=strength(to,to.troops,null).power*(1+to.wall/120);
  return Math.round(A/(A+D)*100);
}
function marchAttack(fromId,toId){
  const from=G.cityById[fromId],to=G.cityById[toId];
  if(to.owner===ME()){toast("That city is already yours.");return;}
  if(G.ally&&to.owner===G.ally){toast(`You are allied with ${FACTIONS[G.ally].short}. Break it first.`);return;}
  if(G.ap<=0){toast("No actions left this turn.");G.marchFrom=null;draw();return;}
  const army=Math.floor(from.troops*0.7);
  const atkOs=officersAt(fromId);
  const naval=isNaval(fromId,toId);
  G.marchFrom=null;draw();
  const odds=battlePreview(army,atkOs,to);
  modal(`March on ${to.name}`,
    `<div class="evt">Your army of <b>${fmt(army)}</b> from ${from.name}`
    +`${atkOs.length?` under ${atkOs.map(o=>o.name).join(", ")}`:""} advances on ${to.name} `
    +`(garrison <b>${fmt(to.troops)}</b>, walls ${to.wall}).<br><br>`
    +`${naval?"⚓ <b>This crossing is fought on the river — a naval battle.</b><br>":""}`
    +`Estimated field strength: <b>${odds}%</b> in your favor.</div>`,
    [{t:naval?"⚓ Fight at sea":"⚔ Fight on the field",cls:"primary",fn:()=>{closeModal();from.troops-=army;spend(1);startTactical(from,to,army,atkOs,naval);}},
     {t:"⚡ Auto-resolve",fn:()=>{closeModal();from.troops-=army;spend(1);resolveBattle(from,to,army,atkOs);}},
     {t:"Withdraw",fn:closeModal}]);
}
function resolveBattle(from,to,army,atkOs){
  const A=strength(null,army,atkOs), D=strength(to,to.troops,null);
  D.power*=(1+to.wall/120);
  const aFire=atkOs.some(o=>/Fire/.test(o.trait||"")); let bonus="";

// ---------- End turn / AI ----------
function endTurn(){

    if(c.order<40&&c.owner!=="neu"&&Math.random()<0.3){const loss=Math.floor(c.troops*0.1);c.troops-=loss;
      if(c.owner===ME())log(`Unrest in ${c.name}! Riots cost ${fmt(loss)} troops.`,"war");}
    c.order=Math.min(100,c.order+3);

  legitimacyPhase();updateCoalition();

// ---------- Living-officer simulation ----------
function loyaltyPhase(){

    if(o._prisoner)return;
    const fac=o.fac; let d=0;
    d += (G.momentum[fac]||0)*3;                      // winning lifts morale, losing erodes it
    const rep = fac===ME()? G.reputation : 62;         // your honor sways your court
    d += (rep-55)/12;
    const city=G.cityById[o.where];
    if(!(city&&city.owner===fac)) d-=2;                // adrift with no post
    if(fac!=="neu"&&citiesOf(fac).length<=1) d -= o.ambition/45;   // a dying cause tempts the ambitious
    d -= (o.ambition-45)/32;                           // baseline ambition erosion
    const ruler=rulerOf(fac); if(ruler&&ruler.id!==o.id) d+=(ruler.cha-72)/22; // a charismatic lord binds the court
    d += ((G.legitimacy[fac]||40)-45)/25;              // legitimacy of the cause
    if(o.isRuler) d+=3;                                // the ruler does not desert himself
    if(G.officers.some(x=>x.fac===fac&&x.id!==o.id&&sworn(x,o))) d+=2.5; // sworn brothers hold fast
    d += (Math.random()-0.5)*2;
    o.loyalty=Math.max(0,Math.min(100,o.loyalty+d));

  checkDefections();
  disloyal.forEach(o=>{ if(G.obyId[o.id]&&o.fac===ME()) log(`⚠ ${o.name}'s loyalty is wavering (${Math.round(o.loyalty)}). Reward him before he turns.`,"war"); });
}
function checkDefections(){

// ---------- Rulers, succession & legitimacy ----------
function pickRuler(f){
  const os=G.officers.filter(o=>o.fac===f&&!o._prisoner);
  if(!os.length)return null;
  for(const id of (RULERS[f]||[])){const o=os.find(x=>x.id===id);if(o)return o;}

function pickHeir(f){

}
function rulerOf(f){const id=G.rulers[f];const o=id&&G.obyId[id];return (o&&o.fac===f&&!o._prisoner)?o:null;}

}
function designateHeir(){

}
function setHeir(id){G.heirs[ME()]=id;const o=G.obyId[id];log(`${o.name} is named your heir.`,"gold");closeModal();renderAll();}
function legitimacyPhase(){
  const total=G.cities.length;
  G.active.filter(f=>f!=="neu").forEach(f=>{
    const share=citiesOf(f).length/total;
    const seat=G.cityById[IMPERIAL_SEAT]&&G.cityById[IMPERIAL_SEAT].owner===f;
    let target=15+share*70+(seat?18:0);

function upkeep(f){

    food+=c.pop*0.05-c.troops*0.06+c.devEcon*200;});
  const ruler=rulerOf(f); if(ruler)gold*=1+(ruler.pol-70)/220; // a capable ruler enriches the state

function aiTurn(f){

  if(restless.length&&(G.treasury[f]||0)>500){restless[0].loyalty=Math.min(100,restless[0].loyalty+12);G.treasury[f]-=200;}
  // is a border city threatened? reinforce it; otherwise grow economy
  mine.forEach(c=>{
    const threat=Math.max(0,...neighborsOf(c.id).map(id=>G.cityById[id]).filter(t=>t.owner!==f&&t.owner!=="neu"&&t.owner!==(f===G.ally?ME():null)).map(t=>t.troops));
    if(threat>c.troops&&(G.treasury[f]||0)>400){c.troops+=2500;G.treasury[f]-=400;}
    else if((G.treasury[f]||0)>500&&Math.random()<0.45){c.devEcon++;G.treasury[f]-=300;}

function aiResolve(from,to,army,f){

  const win=A.power>D.power*1.05;
  const dLoss=Math.round(to.troops*(win?0.65:0.25)),aLoss=Math.round(army*(win?0.25:0.5));
  to.troops=Math.max(0,to.troops-dLoss);const surv=Math.max(0,army-aLoss);

  if(routed){const prev=to.owner;to.owner=f;to.troops=surv;to.order=Math.max(40,to.order-20);
    officersAt(to.id).slice().forEach(o=>relocateOfficerHome(o,prev));
    if(wasMine){log(`${FACTIONS[f].name} has captured ${to.name} from you!`,"war");annal(`${FACTIONS[f].short} captured ${to.name} from you.`,"battle");}
    else annal(`${FACTIONS[f].short} seized ${to.name} from ${FACTIONS[prev].short}.`,"event");
  } else from.troops+=surv;
}
function relocateOfficerHome(o,faction){
  const cur=G.cityById[o.where];if(cur)cur.officers=cur.officers.filter(x=>x!==o.id);
  let homes=citiesOf(faction);
  if(homes.length){const h=homes[0];o.where=h.id;o.fac=faction;h.officers.push(o.id);}
  else {o.fac="neu";const n=citiesOf("neu")[0]||G.cities[0];o.where=n.id;n.officers.push(o.id);}
  o._prisoner=false;
}

// ---------- Events ----------
function maybeEvent(){
  if(G.over)return;
  if(G.turn===2 && G.scen.id==="redcliffs" && ME()==="shu" && !G.ally){
    modal("The Sleeping Dragon Advises","<div class='evt'>Zhuge Liang bows. \"My lord, Cao Cao's host outnumbers us tenfold. Alone we cannot stand. Let me sail to Wu and bind Sun Quan to our cause — then his own ships may turn to ash.\"<br><br><i>Tip: open a Wu city (Chaisang, Jianye) and propose an alliance.</i></div>",
      [{t:"Heed his counsel",cls:"primary",fn:closeModal}]);return;
  }
  if(Math.random()<0.25){
    const mine=citiesOf(ME());if(!mine.length)return;
    const c=mine[Math.floor(Math.random()*mine.length)];const r=Math.random();
    if(r<0.4){const g=300+Math.floor(Math.random()*400);G.treasury[ME()]+=g;log(`A good harvest in ${c.name} brings ${g} gold.`,"gold");}
    else if(r<0.7){c.order=Math.max(10,c.order-25);log(`Bandits stir near ${c.name}; order falls to ${Math.round(c.order)}%.`,"war");}
    else{const o=G.officers.find(o=>o.fac==="neu"&&!o._prisoner&&neighborsOf(c.id).concat(c.id).includes(o.where));
      if(o)log(`A wandering hero, ${o.name}, is seen near ${c.name}. Recruit him!`,"good");}
  }
}

// ---------- Victory ----------
function checkVictory(){
  if(G.over)return;
  const total=G.cities.length,mine=citiesOf(ME()).length;
  if(mine===0){G.over=true;play("defeat");
    annal(`${FACTIONS[ME()].name} was extinguished. The dream ends.`,"death");
    modal("The Mandate is Lost",`<div class="evt">Your banners have fallen and your cause is ended. In another telling, the heroes might yet rise again…</div>`,
      [{t:"📜 Read the Annals",fn:openAnnals},{t:"New Campaign",cls:"primary",fn:()=>{closeModal();showStart();}}]);return;}
  const legit=Math.round(G.legitimacy[ME()]||0);
  const territorial=mine>=Math.ceil(total*0.55);
  const mandate=legit>=88 && mine>=Math.ceil(total*0.42) && G.cityById[IMPERIAL_SEAT].owner===ME();
  if(territorial||mandate){G.over=true;play("victory");
    annal(`${FACTIONS[ME()].name} claimed the Mandate of Heaven and proclaimed a new dynasty over the realm.`,"triumph");
    modal("Mandate of Heaven Claimed!",`<div class="evt">${mandate&&!territorial?`Holding the old capital with a legitimacy of ${legit}, `:""}with ${mine} of ${total} cities under your banner, ${FACTIONS[ME()].name} masters the realm and proclaims a new dynasty. The age of division bends to your will.<br><br><b>Victory!</b></div>`,
      [{t:"📜 Read the Annals",fn:openAnnals},{t:"New Campaign",cls:"primary",fn:()=>{closeModal();showStart();}}]);return;}
}

// ---------- Prisoner management ----------
function openPrisoners(){
  if(!G.prisoners.length){modal("Prisoners","<div class='evt'>You hold no captives. Win a battle and choose to imprison defeated officers to hold them here.</div>",[{t:"Close",cls:"primary",fn:closeModal}]);return;}
  const body=G.prisoners.map(pr=>{const o=G.obyId[pr.offId];const city=G.cityById[pr.cityId];
    return `<div class="prisoner">
      ${avatar(o)}
      <div class="pn">${o.name}<small>${FACTIONS[o.fac].short} · held at ${city?city.name:"?"} · CMD ${o.cmd} MGT ${o.mgt} INT ${o.int}</small></div>
      <div class="pa">
        <button onclick="prisonerAct('${o.id}','recruit')">Recruit</button>
        <button onclick="prisonerAct('${o.id}','release')">Release</button>
        <button onclick="prisonerAct('${o.id}','execute')">Execute</button>
      </div></div>`;}).join("");
  modal("Prisoners",`<div class="hint">Recruiting costs 1 action and depends on your renown and the captor city's charisma. Releasing raises honor; executing lowers it.</div>${body}`,
    [{t:"Close",cls:"primary",fn:closeModal}]);
}
function prisonerAct(id,kind){
  const o=G.obyId[id];const pr=G.prisoners.find(p=>p.offId===id);if(!o||!pr)return;
  const city=G.cityById[pr.cityId];
  if(kind==="recruit"){
    if(G.ap<=0){toast("No actions left this turn.");return;}
    G.ap--;
    const cha=Math.max(60,bestOfficerStat(city,"cha"));
    const chance=cha*0.7 + G.reputation*0.3 - (/Loyal|Honorable/.test(o.trait||"")?20:0);
    if(Math.random()*100<chance){o._prisoner=false;o.fac=ME();o.loyalty=66;o.where=city.id;
      G.prisoners=G.prisoners.filter(p=>p.offId!==id);
      log(`${o.name} accepts your service and is freed from the dungeon!`,"good");}
    else log(`${o.name} spurns your offer and remains imprisoned.`);
  } else if(kind==="release"){
    G.prisoners=G.prisoners.filter(p=>p.offId!==id);relocateOfficerHome(o,o.fac==="neu"?"neu":o.fac);
    G.reputation=Math.min(100,G.reputation+4);log(`You release ${o.name} (honor +4).`,"good");
  } else if(kind==="execute"){
    G.prisoners=G.prisoners.filter(p=>p.offId!==id);const nm=o.name;removeOfficer(o);
    G.reputation=Math.max(0,G.reputation-9);log(`${nm} is put to death (honor −9).`,"war");
  }
  renderAll();openPrisoners();
}

/* ============================================================
   TACTICAL / NAVAL BATTLE LAYER — real-time-with-pause
   ============================================================ */
const WB=100,HB=64;
const TYPES={
  spear:  {n:"Spears",   spd:8,  rng:2.4, dmg:0.95, col:"#4f8a55"},
  sword:  {n:"Infantry", spd:8.5,rng:2.4, dmg:1.05, col:"#8a7248"},
  cavalry:{n:"Cavalry",  spd:17, rng:2.6, dmg:1.25, col:"#b5613a"},
  archer: {n:"Archers",  spd:8,  rng:16,  dmg:0.85, col:"#3f6d9e"},
};
function matchup(a,d){
  if(a==="spear"&&d==="cavalry")return 1.75;
  if(a==="cavalry"&&d==="spear")return 0.6;
  if(a==="cavalry"&&d==="archer")return 1.7;
  if(a==="cavalry"&&d==="sword")return 1.15;
  if(a==="archer"&&d==="spear")return 1.2;
  if(a==="sword"&&d==="archer")return 1.15;
  return 1.0;
}
function assignType(o,i){const t=o.trait||"";
  if(/Cavalry/.test(t))return"cavalry";if(/Archer/.test(t))return"archer";
  if(/Navy|Duelist/.test(t))return"sword";if(/Fire|Ambush/.test(t))return"archer";
  return ["spear","sword","cavalry","archer"][i%4];}
function assignStrat(o){const t=o.trait||"";
  if(/Fire/.test(t))return{id:"fire",name:"Fire Attack",once:true};
  if(/Ambush/.test(t))return{id:"ambush",name:"Ambush",once:true};
  if(/Cavalry/.test(t))return{id:"charge",name:"Cavalry Charge",cd:16};
  if(/Archer/.test(t))return{id:"volley",name:"Arrow Volley",cd:14};
  if(/Healer/.test(t))return{id:"heal",name:"Physician's Aid",cd:12};
  return{id:"rally",name:"Rally",cd:16};}

let B=null;
function pickOfficers(os){return os.slice().sort((a,b)=>b.cmd-a.cmd).slice(0,5);}
function buildSide(troops,officers,faction,side){
  const chosen=officers.length?pickOfficers(officers):[];
  const n=Math.max(1,chosen.length),share=Math.floor(troops/n),units=[];
  const xBase=side==="atk"?12:88;
  for(let i=0;i<n;i++){
    const o=chosen[i]||{name:"Captain",cmd:55,mgt:55,int:45,pol:40,cha:45,_captain:true};
    const y=10+(HB-20)*(n===1?0.5:i/(n-1));
    units.push({id:side+i,side,off:o,faction,type:assignType(o,i),
      strat:{...assignStrat(o),ready:true},maxHp:share,hp:share,x:xBase,y,tx:xBase,ty:y,
      morale:100,order:{type:"idle"},target:null,cd:0,charge:0,contact:0,routing:false,dead:false,left:false});
  }
  return units;
}
function makeTerrain(naval){
  const cols=14,rows=9,tiles=[];
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    let type="plain";
    if(naval){ type = (c===0||c===cols-1)?"shore":"water"; }
    else if(c>=3&&c<=5&&r>=2&&r<=5)type="forest";
    else if(c>=9&&c<=11&&r>=3&&r<=6)type="hill";
    else if(r===rows-1)type="water";
    tiles.push({type});
  }
  return {cols,rows,tiles};
}
function terrainAt(x,y){const t=B.terrain;
  const c=Math.min(t.cols-1,Math.max(0,Math.floor(x/WB*t.cols)));
  const r=Math.min(t.rows-1,Math.max(0,Math.floor(y/HB*t.rows)));
  return t.tiles[r*t.cols+c].type;}

function startTactical(from,to,army,atkOs,naval){
  const defOs=officersAt(to.id);
  B={from,to,army,naval:!!naval,atkFac:from.owner,defFac:to.owner,
    units:[...buildSide(army,atkOs,from.owner,"atk"),...buildSide(to.troops,defOs,to.owner,"def")],
    terrain:makeTerrain(naval),fires:[],texts:[],paused:false,speed:1,time:0,maxTime:150,
    sel:null,fireAim:null,over:false,duelDone:new Set(),duelBusy:false,lastTs:null,
    defWallBonus:1+to.wall/140,isSiege:to.wall>0&&!naval};
  G.mode="battle";G.to=to;G.from=from;B.sparks=[];battleIntensity=true;startMusic();
  document.getElementById("help").style.display="none";
  document.getElementById("legend").style.display="none";
  document.getElementById("endturn").disabled=true;
  buildBattleHUD();document.getElementById("sidehead").textContent=(naval?"Naval Battle — ":"Battle — ")+to.name;
  renderBattleSide();requestAnimationFrame(battleLoop);
  log(`${naval?"Naval battle":"Battle"} joined at ${to.name}!`,"war");
}
function battleLoop(ts){
  if(!B)return;
  if(B.lastTs==null)B.lastTs=ts;let dt=(ts-B.lastTs)/1000;B.lastTs=ts;dt=Math.min(dt,0.05);
  const modalOpen=document.getElementById("modal").classList.contains("show");
  if(!B.paused&&!B.over&&!modalOpen)simulate(dt*B.speed);
  drawBattle();updateBattleHUD();
  if(G.mode==="battle")requestAnimationFrame(battleLoop);
}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function alive(u){return !u.dead&&!u.left;}
function enemiesOf(u){return B.units.filter(v=>alive(v)&&v.side!==u.side);}
function nearestEnemy(u){let best=null,bd=1e9;enemiesOf(u).forEach(v=>{const d=dist(u,v);if(d<bd){bd=d;best=v;}});return best;}
function playerSide(){return "atk";}

function simulate(dt){
  B.time+=dt;
  B.units.forEach(u=>{if(u.cd>0)u.cd-=dt;if(u.charge>0)u.charge-=dt;if(u.contact>0)u.contact-=dt;});
  B.fires.forEach(f=>f.t-=dt);B.fires=B.fires.filter(f=>f.t>0);
  B.texts.forEach(t=>{t.t-=dt;t.y-=8*dt;});B.texts=B.texts.filter(t=>t.t>0);
  if(B.sparks){B.sparks.forEach(s=>{s.t-=dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=30*dt;});B.sparks=B.sparks.filter(s=>s.t>0);}
  B.units.forEach(u=>{if(alive(u)&&!u.routing&&u.side!==playerSide())aiUnit(u);});
  for(const u of B.units){
    if(!alive(u))continue;
    B.fires.forEach(f=>{if(Math.hypot(u.x-f.x,u.y-f.y)<f.r){
      const amp=(terrainAt(u.x,u.y)==="forest"||B.naval)?1.7:1;damage(u,f.rate*amp*dt,null,"fire");}});
    if(u.routing){routeMove(u,dt);recover(u,dt,true);continue;}
    let tgt=u.target&&alive(u.target)?u.target:null;
    if(!tgt){const ne=nearestEnemy(u);
      if(u.order.type==="hold"){if(ne&&dist(u,ne)<TYPES[u.type].rng+3)tgt=ne;}
      else if(u.order.type==="move"){if(ne&&dist(u,ne)<9)tgt=ne;}
      else tgt=ne;}
    const rng=TYPES[u.type].rng;
    if(tgt){const d=dist(u,tgt);
      if(d>rng){
        if(u.order.type==="move"&&Math.hypot(u.x-u.order.x,u.y-u.order.y)>2&&d>9)moveToward(u,u.order.x,u.order.y,dt);
        else{moveToward(u,tgt.x,tgt.y,dt);if(d-rng<1.5&&u.type==="cavalry"&&u.contact<=0)u._chargeHit=true;}
      } else {u.contact=0.6;attack(u,tgt,dt);}
    } else if(u.order.type==="move")moveToward(u,u.order.x,u.order.y,dt);
    recover(u,dt,false);
  }
  checkBattleEnd();
}
function moveToward(u,tx,ty,dt){
  const dx=tx-u.x,dy=ty-u.y,d=Math.hypot(dx,dy)||1;let spd=TYPES[u.type].spd;
  const ter=terrainAt(u.x,u.y);
  if(B.naval){spd*=(/Navy/.test(u.off.trait||"")?1.15:u.type==="cavalry"?0.8:0.95);}
  else{if(ter==="forest")spd*=0.6;else if(ter==="water")spd*=0.5;else if(ter==="hill")spd*=0.8;}
  spd*=0.6+0.4*(u.morale/100);
  const step=Math.min(d,spd*dt);u.x+=dx/d*step;u.y+=dy/d*step;
  u.x=Math.max(2,Math.min(WB-2,u.x));u.y=Math.max(4,Math.min(HB-2,u.y));
}
function routeMove(u,dt){const homeX=u.side==="atk"?-5:WB+5;moveToward(u,homeX,u.y,dt);
  if(u.side==="atk"?u.x<=3:u.x>=WB-3)u.left=true;}
function attack(u,tgt,dt){
  let rate=u.hp*0.052*TYPES[u.type].dmg*matchup(u.type,tgt.type);
  rate*=0.7+u.off.mgt/200;rate*=0.5+0.5*(u.morale/100);
  if(u.off.wounded)rate*=0.7;
  if(B.naval){ if(u.type==="cavalry")rate*=0.5; if(/Navy/.test(u.off.trait||""))rate*=1.4; if(u.type==="archer")rate*=1.1; }
  const tt=terrainAt(tgt.x,tgt.y);let mit=1;
  if(tt==="hill")mit*=0.8;if(tt==="forest"&&u.type==="archer")mit*=0.7;
  if(tgt.side==="def"&&B.isSiege)mit/=B.defWallBonus;
  if(u.type==="cavalry"&&u._chargeHit){rate*=2.0;u._chargeHit=false;u.contact=0.6;floatText(tgt.x,tgt.y,"CHARGE!","#ffca6b");}
  damage(tgt,rate*mit*dt,u,"melee");maybeDuel(u,tgt);
}
function damage(u,cas,src,kind){
  if(!alive(u))return;
  u.hp-=cas;u.morale-=cas/u.maxHp*90*(1-u.off.cmd/400);
  if(kind==="fire")u.morale-=cas/u.maxHp*40;
  if(u.hp<=0){u.hp=0;u.dead=true;floatText(u.x,u.y,"ROUTED","#e05b52");sparks(u.x,u.y,"#e05b52",10);play("clash");screenShake();
    B.units.forEach(v=>{if(alive(v)&&dist(v,u)<22)v.morale+=(v.side===u.side?-14:6);});
    log(`${u.off.name}'s ${TYPES[u.type].n} are destroyed.`,u.side===playerSide()?"war":"good");
  } else if(u.morale<=15&&!u.routing){u.routing=true;floatText(u.x,u.y,"FLEEING!","#e0a35b");}
}
function recover(u,dt,routing){if(u.contact>0)return;
  const base=routing?22+u.off.cmd/6:100;
  if(u.morale<base)u.morale=Math.min(base,u.morale+(routing?4:6)*dt);
  if(routing&&u.morale>40)u.routing=false;}
function floatText(x,y,txt,col){B.texts.push({x,y,txt,col,t:1.1});}
function sparks(x,y,col,n){ if(!B.sparks)B.sparks=[]; for(let i=0;i<(n||8);i++){const a=Math.random()*6.28,sp=8+Math.random()*22;
  B.sparks.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,t:0.5+Math.random()*0.4,col});} }
function aiUnit(u){
  const ne=nearestEnemy(u);if(!ne){u.order={type:"idle"};u.target=null;return;}
  u.target=ne;
  if(u.strat.ready&&(u.strat.cd?u.cd<=0:true)&&!u.routing){
    if(u.strat.id==="fire"){const pc=clusterCenter(enemiesOf(u));if(pc&&pc.n>=2)castFire(u,pc.x,pc.y);}
    else if(dist(u,ne)<TYPES[u.type].rng+2&&Math.random()<0.02)castStrat(u);
  }
}
function clusterCenter(list){if(!list.length)return null;let bx=0,by=0;list.forEach(u=>{bx+=u.x;by+=u.y;});
  bx/=list.length;by/=list.length;return{x:bx,y:by,n:list.filter(u=>Math.hypot(u.x-bx,u.y-by)<14).length};}
function maybeDuel(u,tgt){
  if(B.duelBusy)return;
  if(!/Duelist/.test(u.off.trait||"")||!/Duelist/.test(tgt.off.trait||""))return;
  const key=[u.off.id||u.off.name,tgt.off.id||tgt.off.name].sort().join("|");
  if(B.duelDone.has(key))return;
  if(Math.random()<0.01){B.duelDone.add(key);triggerDuel(u,tgt);}
}
function triggerDuel(a,d){B.duelBusy=true;B.paused=true;play("duel");screenShake();
  modal("⚔ Single Combat",`<div class="evt" style="text-align:center"><b>${a.off.name}</b> (MGT ${a.off.mgt}) charges forth to challenge <b>${d.off.name}</b> (MGT ${d.off.mgt})! The armies pause to watch their champions clash.</div>`,
    [{t:"Watch the duel",cls:"primary",fn:()=>resolveDuel(a,d)}]);}
function resolveDuel(a,d){
  const sa=a.off.mgt+(a.hp/a.maxHp)*20+Math.random()*45,sd=d.off.mgt+(d.hp/d.maxHp)*20+Math.random()*45;
  const aWin=sa>=sd,win=aWin?a:d,lose=aWin?d:a,diff=Math.abs(sa-sd);
  win.morale=Math.min(120,win.morale+28);lose.morale=Math.min(lose.morale,12);lose.routing=true;
  let extra="";if(diff>40&&Math.random()<0.4){lose.off.wounded=true;extra=` ${lose.off.name} is gravely wounded!`;}
  modal("⚔ Single Combat",`<div class="evt" style="text-align:center;font-size:16px"><b style="color:${aWin?'#2f6b54':'#9c2b25'}">${win.off.name} prevails!</b><br><br>${lose.off.name}'s troops falter and break.${extra}</div>`,
    [{t:"Continue",cls:"primary",fn:()=>{closeModal();B.duelBusy=false;B.paused=false;log(`⚔ Duel: ${win.off.name} defeats ${lose.off.name}!`,win.side===playerSide()?"good":"war");}}]);
}
function useSelectedStrat(){
  const u=B.sel;if(!u||u.side!==playerSide()||u.routing)return;
  if(!u.strat.ready){toast("Stratagem already used.");return;}
  if(u.strat.cd&&u.cd>0){toast("Stratagem recharging.");return;}
  if(u.strat.id==="fire"){B.fireAim=u;cv.classList.add("tgtcursor");toast("Click a location to unleash the fire stratagem.");return;}
  castStrat(u);
}
function castStrat(u){const S=u.strat;
  if(S.id==="charge"){u._chargeHit=true;u.morale=Math.min(120,u.morale+15);floatText(u.x,u.y,"CHARGE!","#ffca6b");}
  else if(S.id==="volley"){const t=u.target&&alive(u.target)?u.target:nearestEnemy(u);if(t){damage(t,u.hp*0.55,u,"melee");floatText(t.x,t.y,"VOLLEY","#ffe08a");}}
  else if(S.id==="heal"){B.units.filter(v=>alive(v)&&v.side===u.side&&dist(v,u)<20).forEach(v=>{v.hp=Math.min(v.maxHp,v.hp+v.maxHp*0.12);v.morale=Math.min(120,v.morale+18);});floatText(u.x,u.y,"AID","#8fe0b0");}
  else if(S.id==="rally"){B.units.filter(v=>alive(v)&&v.side===u.side&&dist(v,u)<22).forEach(v=>{v.morale=Math.min(120,v.morale+30);if(v.morale>40)v.routing=false;});floatText(u.x,u.y,"RALLY!","#ffe08a");}
  else if(S.id==="ambush"){enemiesOf(u).filter(v=>dist(v,u)<20).forEach(v=>{damage(v,v.maxHp*0.18,u,"melee");v.morale-=25;});floatText(u.x,u.y,"AMBUSH!","#ff9b5b");}
  markStratUsed(u);
}
function castFire(u,x,y){
  const naval=B.naval,forest=terrainAt(x,y)==="forest";
  B.fires.push({x,y,r:naval?15:12,rate:u.hp*(naval?1.1:0.9),t:naval?7:5.5});
  if(forest){const f=B.fires[B.fires.length-1];f.r=16;f.t=7.5;}
  if(naval){B.fires.push({x:x+8,y:y+4,r:12,rate:u.hp*0.9,t:6});} // fire spreads between ships
  floatText(x,y,"🔥 FIRE!","#ff7a2f");sparks(x,y,"#ff9b3f",16);play("fire");screenShake();
  log(`${u.off.name} unleashes a fire stratagem${naval?" — flames leap between the ships!":forest?" — the forest blazes!":"!"}`,u.side===playerSide()?"good":"war");
  markStratUsed(u);
}
function markStratUsed(u){if(u.strat.once)u.strat.ready=false;if(u.strat.cd)u.cd=u.strat.cd;}
function checkBattleEnd(){
  if(B.over)return;
  const atkStanding=B.units.filter(u=>u.side==="atk"&&alive(u)&&!u.routing).length;
  const defStanding=B.units.filter(u=>u.side==="def"&&alive(u)&&!u.routing).length;
  const atkAny=B.units.some(u=>u.side==="atk"&&alive(u)),defAny=B.units.some(u=>u.side==="def"&&alive(u));
  if(defStanding===0&&(!defAny||atkStanding>0))return endBattle("win");
  if(atkStanding===0&&(!atkAny||defStanding>0))return endBattle("lose");
  if(B.time>=B.maxTime)return endBattle(sumHp("atk")>=sumHp("def")?"win":"lose");
}
function sumHp(side){return B.units.filter(u=>u.side===side&&alive(u)).reduce((s,u)=>s+u.hp,0);}
function endBattle(result){
  if(B.over)return;B.over=true;
  const from=B.from,to=B.to,won=result==="win";
  const atkSurv=Math.round(sumHp("atk")),defSurv=Math.round(sumHp("def"));
  cv.classList.remove("tgtcursor");
  const fallen=B.units.filter(u=>u.side==="def"&&u.off&&!u.off._captain&&(u.dead||u.left));
  awardExp(B.units.filter(u=>u.side==="atk"&&alive(u)).map(u=>u.off), won?70:25);
  if(won){
    const prev=to.owner;to.owner=from.owner;to.troops=Math.max(500,atkSurv);to.order=Math.max(40,to.order-25);to.justTook=true;
    B.units.filter(u=>u.side==="def"&&alive(u)&&u.off&&!u.off._captain).forEach(u=>relocateOfficerHome(u.off,prev));
    const captured=[];fallen.forEach(u=>{if(Math.random()<0.55)captured.push(u.off);else relocateOfficerHome(u.off,prev);});
    finishBattleUI(from,to,atkSurv,defSurv,true,()=>{chronicle(`Your army stormed ${to.name}${B.naval?" in a battle on the river":""} and took the city.`,"triumph");
      processCaptures(captured,to.name,officersAt(from.id).concat(B.units.filter(u=>u.side==="atk"&&alive(u)).map(u=>u.off)));});
  } else {
    from.troops+=atkSurv;
    finishBattleUI(from,to,atkSurv,defSurv,false,()=>{chronicle(`Your assault on ${to.name} was thrown back.`,"battle");exitBattle();});
  }
}
function finishBattleUI(from,to,atkSurv,defSurv,won,next){
  play(won?"capture":"defeat");
  modal(won?`Victory at ${to.name}!`:`Defeat at ${to.name}`,
    `<div class="battle-line"><div class="battle-side" style="color:${facColor(B.atkFac)}"><b>Your army</b><br>${fmt(atkSurv)} survive</div>`
    +`<div class="vs">${won?"⚑":"✕"}</div>`
    +`<div class="battle-side" style="text-align:right;color:${facColor(B.defFac)}"><b>${to.name}</b><br>${fmt(defSurv)} remain</div></div>`
    +`<div class="evt" style="margin-top:10px">${won?`The ${B.naval?"river":"field"} is yours. Your survivors occupy ${to.name}.`:`Your army falls back to ${from.name}.`}</div>`,
    [{t:"Continue",cls:"primary",fn:()=>{closeModal();next();}}]);
}
function exitBattle(){
  B=null;G.mode="map";battleIntensity=false;
  document.getElementById("bhud").classList.remove("show");
  document.getElementById("legend").style.display="";
  document.getElementById("help").style.display="";
  document.getElementById("endturn").disabled=false;
  if(G.to)G.sel=G.to.id;
  renderAll();checkVictory();
  if(!G.over)autosave();
}

/* ---- captured-officer decisions ---- */
function removeOfficer(o){
  const c=G.cityById[o.where];if(c)c.officers=c.officers.filter(x=>x!==o.id);
  G.officers=G.officers.filter(x=>x.id!==o.id);delete G.obyId[o.id];
  G.prisoners=G.prisoners.filter(p=>p.offId!==o.id);
  if(o.isRuler&&G.rulers)handleSuccession(o.fac,o.name);
}
function relocatePrisoner(o){const cur=G.cityById[o.where];if(cur)cur.officers=cur.officers.filter(x=>x!==o.id);
  o.where=G.to.id;o._prisoner=true;if(!G.cityById[G.to.id].officers.includes(o.id))G.cityById[G.to.id].officers.push(o.id);}
function sworn(a,b){const oath=["liubei","guanyu","zhangfei"];return oath.includes(a.id)&&oath.includes(b.id);}
function processCaptures(list,cityName,recruiters){
  const queue=list.slice();const bestCha=Math.max(60,...recruiters.map(o=>o.cha||0));
  function nextOne(){
    if(!queue.length){exitBattle();return;}
    const o=queue.shift();
    const bond=G.officers.find(x=>x.fac===ME()&&sworn(x,o));
    modal(`Captured: ${o.name}`,
      `<div class="evt">${o.name} of ${FACTIONS[o.fac].name} is taken at ${cityName}.${bond?` <b>${bond.name}</b> shares a sworn bond with this officer.`:""}${/Honorable|Loyal/.test(o.trait||"")?" This officer is known for unbending loyalty.":""}</div>`
      +`<div class="captured-stat"><div class="cs">CMD<b>${o.cmd}</b></div><div class="cs">MGT<b>${o.mgt}</b></div><div class="cs">INT<b>${o.int}</b></div><div class="cs">POL<b>${o.pol}</b></div><div class="cs">CHA<b>${o.cha}</b></div></div>`
      +`<div class="hint">Your honor stands at <b>${Math.round(G.reputation)}</b>.</div>`,null);
    const foot=document.getElementById("m-foot");foot.innerHTML="";foot.style.display="block";
    const wrap=document.createElement("div");wrap.className="cap-choices";
    const opts=[
      {t:"Recruit",d:"Win them over",fn:()=>{
        const chance=bestCha*0.8-(o.loyalty-50)+(bond?25:0)-(/Loyal|Honorable/.test(o.trait||"")?20:0);
        if(Math.random()*100<chance){o.fac=ME();o.loyalty=68;o.where=G.to.id;o._prisoner=false;G.cityById[G.to.id].officers.push(o.id);
          G.reputation=Math.min(100,G.reputation+1);annal(`${o.name} was captured and pledged to serve you.`,"event");resultMsg(`${o.name} is moved by your virtue and pledges to serve you!`,"good",nextOne);}
        else{G.prisoners.push({offId:o.id,cityId:G.to.id});relocatePrisoner(o);resultMsg(`${o.name} refuses and is held prisoner.`,null,nextOne);}
      }},
      {t:"Release",d:"Free them (+honor)",fn:()=>{relocateOfficerHome(o,o.fac);G.reputation=Math.min(100,G.reputation+4);
        resultMsg(`You release ${o.name}; word of your magnanimity spreads (honor +4).`,"good",nextOne);}},
      {t:"Imprison",d:"Hold captive",fn:()=>{G.prisoners.push({offId:o.id,cityId:G.to.id});relocatePrisoner(o);
        G.reputation=Math.max(0,G.reputation-1);G.cityById[G.to.id].order-=4;resultMsg(`${o.name} is cast into your dungeons.`,null,nextOne);}},
      {t:"Execute",d:"Put to death (−honor)",fn:()=>{const nm=o.name,angered=bond;removeOfficer(o);
        G.reputation=Math.max(0,G.reputation-9);if(angered)angered.loyalty=Math.max(20,angered.loyalty-15);
        annal(`You had ${nm} executed after his capture.`,"death");
        resultMsg(`${nm} is executed. The realm recoils (honor −9)${angered?`, and ${angered.name} grieves.`:"."}`,"war",nextOne);}},
    ];
    opts.forEach(op=>{const b=document.createElement("button");b.innerHTML=`${op.t}<small>${op.d}</small>`;b.onclick=op.fn;wrap.appendChild(b);});
    foot.appendChild(wrap);
  }
  nextOne();
}
function resultMsg(msg,cls,then){log(msg,cls||undefined);
  document.getElementById("m-body").innerHTML=`<div class="evt">${msg}</div>`;
  const foot=document.getElementById("m-foot");foot.style.display="";foot.innerHTML="";
  const b=document.createElement("button");b.className="primary";b.textContent="Continue";b.onclick=()=>{closeModal();then();};foot.appendChild(b);}

/* ---- battle rendering ---- */
function bx(x){return x/WB*cv.clientWidth;}
function by(y){return y/HB*cv.clientHeight;}
function drawBattle(){
  const cw=cv.clientWidth,ch=cv.clientHeight,t=B.terrain,tw=cw/t.cols,th=ch/t.rows;
  for(let r=0;r<t.rows;r++)for(let c=0;c<t.cols;c++){
    const ty=t.tiles[r*t.cols+c].type;
    const T=TH();ctx.fillStyle=ty==="forest"?T.terrForest:ty==="hill"?T.terrHill:ty==="water"?T.terrWater:ty==="shore"?T.terrShore:T.terrPlain;
    ctx.fillRect(c*tw,r*th,tw+1,th+1);
    if(ty==="forest"){ctx.fillStyle="rgba(60,110,70,.5)";for(let k=0;k<3;k++)ctx.fillRect(c*tw+8+k*14,r*th+10+((k*13)%20),6,10);}
    if(ty==="water"){ctx.strokeStyle="rgba(150,190,210,.12)";ctx.beginPath();ctx.moveTo(c*tw,r*th+th*0.5);ctx.lineTo(c*tw+tw,r*th+th*0.5);ctx.stroke();}
    if(ty==="hill"){ctx.strokeStyle="rgba(255,255,255,.06)";ctx.beginPath();ctx.moveTo(c*tw,r*th+th);ctx.lineTo(c*tw+tw/2,r*th+th*0.4);ctx.lineTo(c*tw+tw,r*th+th);ctx.stroke();}
  }
  if(B.isSiege){ctx.strokeStyle="rgba(180,140,90,.6)";ctx.lineWidth=4;ctx.setLineDash([2,6]);
    ctx.beginPath();ctx.moveTo(bx(80),by(2));ctx.lineTo(bx(80),by(HB-2));ctx.stroke();ctx.setLineDash([]);ctx.lineWidth=1;}
  B.fires.forEach(f=>{const a=Math.min(1,f.t/1.5);
    const g=ctx.createRadialGradient(bx(f.x),by(f.y),4,bx(f.x),by(f.y),bx(f.r));
    g.addColorStop(0,`rgba(255,180,60,${.7*a})`);g.addColorStop(.5,`rgba(230,90,30,${.5*a})`);g.addColorStop(1,"rgba(120,30,10,0)");
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(bx(f.x),by(f.y),bx(f.r),0,7);ctx.fill();});
  B.units.forEach(u=>{if(u.left)return;
    const p={x:bx(u.x),y:by(u.y)},r=10+Math.sqrt(Math.max(0,u.hp))/12,fcol=facColor(u.faction);
    if(u.dead)ctx.globalAlpha=.25;else if(u.routing)ctx.globalAlpha=.5;
    if(B.sel===u){ctx.strokeStyle="#ffe08a";ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,r+6,0,7);ctx.stroke();}
    if(B.naval){ // draw ships as boat shapes
      ctx.fillStyle=fcol;ctx.strokeStyle="#12100c";ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(p.x-r,p.y);ctx.quadraticCurveTo(p.x,p.y+r*0.9,p.x+r,p.y);ctx.lineTo(p.x+r*0.7,p.y-r*0.4);ctx.lineTo(p.x-r*0.7,p.y-r*0.4);ctx.closePath();ctx.fill();ctx.stroke();
      ctx.strokeStyle=TYPES[u.type].col;ctx.beginPath();ctx.moveTo(p.x,p.y-r*0.4);ctx.lineTo(p.x,p.y-r*1.1);ctx.stroke();
    } else {
      ctx.fillStyle=fcol;ctx.strokeStyle="#12100c";ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.fill();ctx.stroke();
      ctx.strokeStyle=TYPES[u.type].col;ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,r-3,0,7);ctx.stroke();
    }
    ctx.fillStyle="#fff";ctx.font="bold 11px system-ui,sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(TYPES[u.type].n[0],p.x,p.y-(B.naval?2:0));
    ctx.globalAlpha=1;
    const bw=r*2;
    ctx.fillStyle="#000";ctx.fillRect(p.x-r,p.y+r+3,bw,4);
    ctx.fillStyle=u.side===playerSide()?"#2f8f5b":"#c0392b";ctx.fillRect(p.x-r,p.y+r+3,bw*(u.hp/u.maxHp),4);
    ctx.fillStyle="#000";ctx.fillRect(p.x-r,p.y+r+8,bw,3);
    ctx.fillStyle=u.morale<30?"#e0a35b":"#d8cbb0";ctx.fillRect(p.x-r,p.y+r+8,bw*Math.max(0,Math.min(1,u.morale/100)),3);
    ctx.fillStyle="#f3ead7";ctx.font="11px system-ui,sans-serif";ctx.textBaseline="top";ctx.fillText(u.off.name+(u.off.wounded?" ⚕":""),p.x,p.y-r-15);
    ctx.fillStyle=TYPES[u.type].col;ctx.font="9px system-ui,sans-serif";ctx.fillText(fmt(u.hp)+" · "+TYPES[u.type].n,p.x,p.y-r-4);
  });
  ctx.textBaseline="alphabetic";
  if(B.fireAim){ctx.fillStyle="#ff7a2f";ctx.font="13px system-ui,sans-serif";ctx.textAlign="center";ctx.fillText("◎ click to target fire stratagem",cw/2,24);}
  if(B.sparks)B.sparks.forEach(s=>{ctx.globalAlpha=Math.max(0,Math.min(1,s.t*2));ctx.fillStyle=s.col;ctx.fillRect(bx(s.x)-1.5,by(s.y)-1.5,3,3);});
  ctx.globalAlpha=1;
  B.texts.forEach(t=>{ctx.globalAlpha=Math.min(1,t.t);ctx.fillStyle=t.col;ctx.font="bold 13px system-ui,sans-serif";ctx.textAlign="center";ctx.fillText(t.txt,bx(t.x),by(t.y));ctx.globalAlpha=1;});
}
function battleClick(e){
  const rect=cv.getBoundingClientRect();
  const wx=(e.clientX-rect.left)/cv.clientWidth*WB,wy=(e.clientY-rect.top)/cv.clientHeight*HB;
  if(B.fireAim){castFire(B.fireAim,wx,wy);B.fireAim=null;cv.classList.remove("tgtcursor");return;}
  let hit=null,bd=1e9;
  B.units.forEach(u=>{if(u.left)return;const d=Math.hypot(bx(u.x)-(e.clientX-rect.left),by(u.y)-(e.clientY-rect.top));
    const r=14+Math.sqrt(Math.max(0,u.hp))/12;if(d<r&&d<bd){bd=d;hit=u;}});
  if(hit){
    if(hit.side===playerSide()){B.sel=hit;renderBattleSide();return;}
    if(B.sel&&alive(B.sel)&&!B.sel.routing){B.sel.order={type:"attack"};B.sel.target=hit;}return;
  }
  if(B.sel&&alive(B.sel)&&!B.sel.routing){B.sel.order={type:"move",x:wx,y:wy};B.sel.target=null;}
}

    <div class="row"><span>Morale</span><b>${Math.round(u.morale)}%${u.routing?" (fleeing!)":""}</b></div>${pct(u.morale,100,u.morale<30?"#c0392b":"#8a7d63")}
    <div class="row"><span>Command / Might</span><b>${u.off.cmd} / ${u.off.mgt}</b></div>

      <div class="st">${x.dead?"routed":fmt(x.hp)}<br>${x.routing&&!x.dead?"fleeing":Math.round(x.morale)+"% mor"}</div></div>`).join("")}</div>`;
}

cv.addEventListener("click",e=>{
  if(!G||G.over)return;
  if(G.mode==="battle"){return battleClick(e);}
  const rect=cv.getBoundingClientRect();const mx=e.clientX-rect.left,my=e.clientY-rect.top;

  G.cities.forEach(c=>{const p=px(c),d=Math.hypot(p.x-mx,p.y-my),r=10+c.devEcon*1.0+6;if(d<r&&d<best){best=d;hit=c;}});
